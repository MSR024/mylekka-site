<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLekka.in — Know Your Spend.</title>
<meta name="description" content="MyLekka.in — Know Your Spend. Made for India. Coming soon.">

<link rel="canonical" href="https://mylekka.in/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://mylekka.in/">
<meta property="og:title" content="MyLekka.in — Know Your Spend.">
<meta property="og:description" content="Made for India. Coming soon.">
<meta property="og:locale" content="en_IN">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%236e1f1f'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23f4ead0' font-family='Georgia,serif'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon: #6e1f1f;
    --maroon-deep: #431110;
    --saffron: #ff9933;
    --india-green: #146c36;
    --brass: #b8902e;
    --brass-light: #d8b451;
    --cream: #f4ead0;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin:0;
    min-height: 100svh;
    display:flex; flex-direction:column;
    background: linear-gradient(160deg, var(--maroon) 0%, var(--maroon-deep) 85%);
    color: var(--cream);
    font-family:'IBM Plex Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }

  .page{
    position: relative;
    flex: 1 1 auto;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding: 6vh 6vw;
    overflow: hidden;
  }

  .corner{ position:absolute; width:48px; height:48px; opacity:.6; }
  .corner svg{ width:100%; height:100%; }
  .corner.tl{ top:22px; left:22px; }
  .corner.tr{ top:22px; right:22px; }
  .corner.bl{ bottom:22px; left:22px; }
  .corner.br{ bottom:22px; right:22px; }
  @media (max-width: 640px){ .corner{ width:32px; height:32px; } }

  .bg-rupee{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%, -48%);
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(16rem, 42vw, 30rem);
    line-height: 1;
    color: var(--cream);
    opacity: 0.05;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  .content{ position:relative; z-index:1; animation: fadeIn 1s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .content{ animation:none; } }

  .eyebrow{
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(244,234,208,0.65);
    margin: 0 0 1.2rem;
  }
  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style: italic;
    font-optical-sizing: auto;
    font-size: clamp(2.8rem, 9vw, 5.5rem);
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--cream);
  }
  .tagline{
    font-size: clamp(0.85rem, 2vw, 1rem);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin: 1rem 0 0;
    color: var(--brass-light);
  }

  .tricolor-line{
    width: 52px; height: 3px;
    border-radius: 2px;
    margin: 1.8rem auto;
    background: linear-gradient(90deg,
      var(--saffron) 0%, var(--saffron) 33.33%,
      var(--cream) 33.33%, var(--cream) 66.66%,
      var(--india-green) 66.66%, var(--india-green) 100%);
    opacity: 0.9;
  }

  .made-for{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    color: var(--cream);
    margin: 0 0 0.6rem;
  }
  .coming-soon{
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,234,208,0.7);
    margin: 0;
  }

  footer{
    position: relative;
    z-index: 1;
    padding: 0 6vw 4vh;
    text-align:center;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    color: rgba(244,234,208,0.5);
    display:flex; flex-direction:column; gap:0.5rem;
    align-items:center;
  }
  footer a{
    color: rgba(244,234,208,0.65);
    text-decoration: none;
  }
  footer a:hover, footer a:focus-visible{ color: var(--cream); text-decoration: underline; }
  footer a:focus-visible{ outline: 2px solid var(--brass); outline-offset: 2px; }
</style>
</head>
<body>

  <div class="page">
    <div class="corner tl" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M2 2 L2 30 M2 2 L30 2" stroke="#d8b451" stroke-width="2" fill="none" opacity="0.75"/></svg></div>
    <div class="corner tr" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M62 2 L62 30 M62 2 L34 2" stroke="#d8b451" stroke-width="2" fill="none" opacity="0.75"/></svg></div>
    <div class="corner bl" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M2 62 L2 34 M2 62 L30 62" stroke="#d8b451" stroke-width="2" fill="none" opacity="0.75"/></svg></div>
    <div class="corner br" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M62 62 L62 34 M62 62 L34 62" stroke="#d8b451" stroke-width="2" fill="none" opacity="0.75"/></svg></div>

    <span class="bg-rupee" aria-hidden="true">&#8377;</span>

    <div class="content">
      <p class="eyebrow">MyLekka.in</p>
      <h1 class="wordmark">MyLekka</h1>
      <p class="tagline">Know Your Spend.</p>
      <div class="tricolor-line" aria-hidden="true"></div>
      <p class="made-for">Made for India.</p>
      <p class="coming-soon">Coming Soon.</p>
    </div>
  </div>

  <footer>
    <span>&copy; 2026 MyLekka. All rights reserved.</span>
    <a href="mailto:hello@mylekka.in">Contact</a>
  </footer>

</body>
</html>
